<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Habit Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-teal: #00f5ff;
      --accent-green: #00ff88;
      --bg: #0a0e14;
      --surface: #141a24;
      --surface2: #1c2332;
      --text: #e8eef5;
      --text-dim: #8a94a8;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid rgba(0, 245, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      color: var(--accent-teal);
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .card {
      background: var(--surface2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(0, 245, 255, 0.1);
    }

    .card-title {
      font-size: 13px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .clock-display {
      font-family: 'Monaco', monospace;
      font-size: 48px;
      font-weight: 700;
      color: var(--accent-teal);
      margin-bottom: 16px;
    }

    .status-message {
      font-size: 16px;
      margin-bottom: 16px;
      color: var(--text);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      background: rgba(20, 26, 36, 0.6);
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-teal);
      background: rgba(0, 245, 255, 0.05);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-teal));
      border: none;
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    .habit-item {
      background: rgba(0, 245, 255, 0.05);
      border: 1px solid rgba(0, 245, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .habit-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 245, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .habit-checkbox.checked {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: var(--bg);
    }

    .habit-name {
      flex: 1;
      font-size: 14px;
    }

    textarea {
      width: 100%;
      padding: 10px 12px;
      background: rgba(20, 26, 36, 0.6);
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-radius: 8px;
      color: var(--text);
      min-height: 100px;
      font-family: inherit;
      resize: vertical;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent-teal);
      background: rgba(0, 245, 255, 0.05);
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 20px;
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; height: 100%;">
    <div class="top-bar">
      <div class="logo">📊 Habit Tracker</div>
      <div class="day-counter" id="dayCounter">Day 1</div>
    </div>

    <div class="main-content">
      <div class="card">
        <div class="clock-display" id="clockDisplay">00:00:00</div>
        <div class="status-message" id="statusMessage">Loading...</div>
      </div>

      <div class="card">
        <div class="card-title">Life Habits</div>
        <div class="input-group">
          <input type="text" id="habitInput" placeholder="Add a new habit...">
          <button class="btn" onclick="app.addHabit()">+ Add</button>
        </div>
        <div id="habitsContainer" class="empty-state">No habits yet</div>
      </div>

      <div class="card">
        <div class="card-title">Quick Notes</div>
        <textarea id="quickNotesArea" placeholder="What's on your mind?"></textarea>
      </div>
    </div>
  </div>

  <script>
    // Create app namespace to avoid global conflicts
    const app = {
      // ========================================================================
      // CONFIG
      // ========================================================================
      supabaseUrl: 'https://zrswmcjeltxyeamupofo.supabase.co',
      supabaseKey: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpyc3dtY2plbHR4eWVhbXVwb2ZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjI2MTksImV4cCI6MjEwMjgzODYxOX0.BzzvGWsP6xUykXkRZMKz-i28Kh-DjrPu_sJiaF-vOgM',
      
      // STATE
      supabase: null,
      deviceId: localStorage.getItem('deviceId') || 'device-' + Math.random().toString(36).substr(2, 9),
      userData: {
        lifeHabits: [],
        notesQuick: '',
        _u: Date.now()
      },

      // ========================================================================
      // INIT
      // ========================================================================
      init() {
        console.log('🚀 App initializing...');
        
        // Save device ID
        if (!localStorage.getItem('deviceId')) {
          localStorage.setItem('deviceId', this.deviceId);
        }

        this.loadUserData();
        this.setupClockInterval();

        // Initialize Supabase after a short delay
        setTimeout(() => {
          this.initSupabase();
        }, 500);
      },

      setupClockInterval() {
        setInterval(() => this.updateClock(), 1000);
      },

      initSupabase() {
        try {
          this.supabase = window.supabase.createClient(this.supabaseUrl, this.supabaseKey);
          console.log('✅ Supabase connected');

          // Listen for realtime updates from other devices
          this.supabase
            .channel('sync_updates')
            .on(
              'postgres_changes',
              { event: '*', schema: 'public', table: 'sync_data' },
              (payload) => this.handleRemoteSync(payload)
            )
            .subscribe((status) => {
              console.log('📡 Realtime subscription status:', status);
            });
        } catch (error) {
          console.warn('Supabase error (app works offline):', error);
        }
      },

      // ========================================================================
      // DATA
      // ========================================================================
      loadUserData() {
        console.log('📂 Loading data...');
        const stored = localStorage.getItem('habitTrackerData');
        if (stored) {
          try {
            this.userData = JSON.parse(stored);
            console.log('✅ Data loaded');
          } catch (e) {
            console.error('Parse error:', e);
            this.userData = { lifeHabits: [], notesQuick: '', _u: Date.now() };
          }
        }
        this.renderAll();
      },

      saveUserData() {
        console.log('💾 Saving...');
        this.userData._u = Date.now();
        localStorage.setItem('habitTrackerData', JSON.stringify(this.userData));
        
        // Sync to Supabase in background
        if (this.supabase) {
          this.syncToSupabase();
        }
      },

      async syncToSupabase() {
        if (!this.supabase) return;

        try {
          // Check if device record exists
          const { data: existing, error: selectError } = await this.supabase
            .from('sync_data')
            .select('id')
            .eq('device_id', this.deviceId)
            .limit(1);

          if (selectError) throw selectError;

          const syncData = {
            device_id: this.deviceId,
            user_data: this.userData,
            timestamp: this.userData._u
          };

          let result;
          if (existing && existing.length > 0) {
            result = await this.supabase
              .from('sync_data')
              .update(syncData)
              .eq('device_id', this.deviceId);
          } else {
            result = await this.supabase
              .from('sync_data')
              .insert([syncData]);
          }

          if (result.error) throw result.error;
          console.log('☁️ Synced to Supabase');
        } catch (error) {
          console.warn('Sync failed:', error?.message || error);
        }
      },

      handleRemoteSync(payload) {
        if (!payload.new) return;
        if (payload.new.device_id === this.deviceId) return;

        console.log('📱 Update from another device');
        if (payload.new.timestamp > this.userData._u) {
          this.userData = payload.new.user_data;
          localStorage.setItem('habitTrackerData', JSON.stringify(this.userData));
          this.renderAll();
        }
      },

      // ========================================================================
      // UI - RENDERING
      // ========================================================================
      renderAll() {
        this.updateClock();
        this.renderHabits();
        this.loadQuickNotes();
      },

      updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        document.getElementById('clockDisplay').textContent = `${h}:${m}:${s}`;

        const hour = now.getHours();
        let msg = '🌅 Good morning';
        if (hour >= 5 && hour < 12) msg = '🌅 Good morning';
        else if (hour >= 12 && hour < 17) msg = '☀️ Good afternoon';
        else if (hour >= 17 && hour < 21) msg = '🌆 Good evening';
        else msg = '🌙 Late night';
        document.getElementById('statusMessage').textContent = msg;

        const startOfYear = new Date(now.getFullYear(), 0, 1);
        const dayOfYear = Math.floor((now - startOfYear) / 86400000) + 1;
        document.getElementById('dayCounter').textContent = `Day ${dayOfYear}`;
      },

      renderHabits() {
        const container = document.getElementById('habitsContainer');
        const today = new Date().toISOString().split('T')[0];

        if (!this.userData.lifeHabits || this.userData.lifeHabits.length === 0) {
          container.innerHTML = '<div class="empty-state">No habits yet. Add one to get started!</div>';
          return;
        }

        container.innerHTML = this.userData.lifeHabits.map(habit => {
          const done = habit.completedDates && habit.completedDates.includes(today);
          return `
            <div class="habit-item">
              <div class="habit-checkbox ${done ? 'checked' : ''}" onclick="app.toggleHabit('${habit.id}')">
                ${done ? '✓' : ''}
              </div>
              <div class="habit-name">${habit.name}</div>
            </div>
          `;
        }).join('');
      },

      loadQuickNotes() {
        const area = document.getElementById('quickNotesArea');
        area.value = this.userData.notesQuick || '';
        area.removeEventListener('input', this.noteHandler);
        area.addEventListener('input', (e) => {
          this.userData.notesQuick = e.target.value;
          this.saveUserData();
        });
      },

      // ========================================================================
      // HABITS
      // ========================================================================
      addHabit() {
        const input = document.getElementById('habitInput');
        const name = input.value.trim();
        if (!name) {
          alert('Enter a habit name');
          return;
        }

        this.userData.lifeHabits.push({
          id: Date.now().toString(),
          name: name,
          completedDates: []
        });

        input.value = '';
        this.saveUserData();
        this.renderHabits();
        console.log('✅ Habit added');
      },

      toggleHabit(habitId) {
        const today = new Date().toISOString().split('T')[0];
        const habit = this.userData.lifeHabits.find(h => h.id === habitId);

        if (!habit) return;
        if (!habit.completedDates) habit.completedDates = [];

        if (habit.completedDates.includes(today)) {
          habit.completedDates = habit.completedDates.filter(d => d !== today);
        } else {
          habit.completedDates.push(today);
        }

        this.saveUserData();
        this.renderHabits();
        console.log('✅ Habit toggled');
      }
    };

    // ========================================================================
    // START APP
    // ========================================================================
    document.addEventListener('DOMContentLoaded', () => app.init());
    if (document.readyState !== 'loading') app.init();
  </script>
</body>
</html>
