<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Habit Tracker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent-teal: #00f5ff;
      --accent-green: #00ff88;
      --bg: #0a0e14;
      --surface: #141a24;
      --surface2: #1c2332;
      --text: #e8eef5;
      --text-dim: #8a94a8;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid rgba(0, 245, 255, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      color: var(--accent-teal);
    }

    .main-content {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .card {
      background: var(--surface2);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid rgba(0, 245, 255, 0.1);
    }

    .card-title {
      font-size: 13px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .clock-display {
      font-family: 'Monaco', monospace;
      font-size: 48px;
      font-weight: 700;
      color: var(--accent-teal);
      margin-bottom: 16px;
    }

    .status-message {
      font-size: 16px;
      margin-bottom: 16px;
      color: var(--text);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input {
      flex: 1;
      background: rgba(20, 26, 36, 0.6);
      border: 1px solid rgba(0, 245, 255, 0.2);
      border-radius: 8px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-teal);
      background: rgba(0, 245, 255, 0.05);
    }

    .btn {
      background: linear-gradient(135deg, var(--accent-green), var(--accent-teal));
      border: none;
      color: var(--bg);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
    }

    .habit-item {
      background: rgba(0, 245, 255, 0.05);
      border: 1px solid rgba(0, 245, 255, 0.1);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .habit-checkbox {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 245, 255, 0.3);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .habit-checkbox.checked {
      background: var(--accent-green);
      border-color: var(--accent-green);
      color: var(--bg);
    }

    .habit-name {
      flex: 1;
      font-size: 14px;
    }

    .empty-state {
      text-align: center;
      color: var(--text-dim);
      padding: 20px;
    }
  </style>
</head>
<body>
  <div style="display: flex; flex-direction: column; height: 100%;">
    <div class="top-bar">
      <div class="logo">📊 Habit Tracker</div>
      <div class="day-counter" id="dayCounter">Day 1</div>
    </div>

    <div class="main-content">
      <div class="card">
        <div class="clock-display" id="clockDisplay">00:00:00</div>
        <div class="status-message" id="statusMessage">Loading...</div>
      </div>

      <div class="card">
        <div class="card-title">Life Habits</div>
        <div class="input-group">
          <input type="text" id="habitInput" placeholder="Add a new habit...">
          <button class="btn" onclick="addHabit()">+ Add</button>
        </div>
        <div id="habitsContainer" class="empty-state">No habits yet</div>
      </div>

      <div class="card">
        <div class="card-title">Quick Notes</div>
        <textarea id="quickNotesArea" placeholder="What's on your mind?" style="width: 100%; padding: 10px 12px; background: rgba(20, 26, 36, 0.6); border: 1px solid rgba(0, 245, 255, 0.2); border-radius: 8px; color: var(--text); min-height: 100px; font-family: inherit; resize: vertical;"></textarea>
      </div>
    </div>
  </div>

  <script>
    // ============================================================================
    // APP STATE
    // ============================================================================
    let userData = {
      lifeHabits: [],
      notesQuick: '',
      _u: Date.now()
    };

    // ============================================================================
    // LOAD & SAVE
    // ============================================================================
    function loadUserData() {
      console.log('Loading user data...');
      const stored = localStorage.getItem('habitTrackerData');
      if (stored) {
        try {
          userData = JSON.parse(stored);
          console.log('Data loaded from localStorage');
        } catch (e) {
          console.error('Failed to parse stored data:', e);
          userData = { lifeHabits: [], notesQuick: '', _u: Date.now() };
        }
      }
      renderAll();
    }

    function saveUserData() {
      console.log('Saving user data...');
      userData._u = Date.now();
      localStorage.setItem('habitTrackerData', JSON.stringify(userData));
    }

    // ============================================================================
    // RENDER
    // ============================================================================
    function renderAll() {
      updateClock();
      renderHabits();
      loadQuickNotes();
    }

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('clockDisplay').textContent = `${h}:${m}:${s}`;

      const hour = now.getHours();
      let msg = '🌅 Good morning';
      if (hour >= 5 && hour < 12) msg = '🌅 Good morning';
      else if (hour >= 12 && hour < 17) msg = '☀️ Good afternoon';
      else if (hour >= 17 && hour < 21) msg = '🌆 Good evening';
      else msg = '🌙 Late night';
      document.getElementById('statusMessage').textContent = msg;

      const startOfYear = new Date(new Date().getFullYear(), 0, 1);
      const dayOfYear = Math.floor((now - startOfYear) / 86400000) + 1;
      document.getElementById('dayCounter').textContent = `Day ${dayOfYear}`;
    }

    function renderHabits() {
      const container = document.getElementById('habitsContainer');
      const today = new Date().toISOString().split('T')[0];

      if (!userData.lifeHabits || userData.lifeHabits.length === 0) {
        container.innerHTML = '<div class="empty-state">No habits yet. Add one to get started!</div>';
        return;
      }

      container.innerHTML = userData.lifeHabits.map(habit => {
        const done = habit.completedDates && habit.completedDates.includes(today);
        return `
          <div class="habit-item">
            <div class="habit-checkbox ${done ? 'checked' : ''}" onclick="toggleHabit('${habit.id}')">
              ${done ? '✓' : ''}
            </div>
            <div class="habit-name">${habit.name}</div>
          </div>
        `;
      }).join('');
    }

    function loadQuickNotes() {
      const area = document.getElementById('quickNotesArea');
      area.value = userData.notesQuick || '';
      area.addEventListener('input', (e) => {
        userData.notesQuick = e.target.value;
        saveUserData();
      });
    }

    // ============================================================================
    // HABITS
    // ============================================================================
    function addHabit() {
      const input = document.getElementById('habitInput');
      const name = input.value.trim();
      if (!name) {
        alert('Enter a habit name');
        return;
      }

      userData.lifeHabits.push({
        id: Date.now().toString(),
        name: name,
        completedDates: []
      });

      input.value = '';
      saveUserData();
      renderHabits();
      console.log('Habit added');
    }

    function toggleHabit(habitId) {
      const today = new Date().toISOString().split('T')[0];
      const habit = userData.lifeHabits.find(h => h.id === habitId);
      
      if (!habit.completedDates) habit.completedDates = [];
      
      if (habit.completedDates.includes(today)) {
        habit.completedDates = habit.completedDates.filter(d => d !== today);
      } else {
        habit.completedDates.push(today);
      }

      saveUserData();
      renderHabits();
      console.log('Habit toggled');
    }

    // ============================================================================
    // INIT
    // ============================================================================
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM Content Loaded');
      loadUserData();
    });

    // Update clock every second
    setInterval(updateClock, 1000);

    // If DOM is already loaded (happens with inline scripts)
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadUserData);
    } else {
      loadUserData();
    }

    console.log('Script loaded and running');
  </script>
</body>
</html>
